{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Edit Trek: {{ trek.name }}</h4>
                    <a href="{{ url_for('admin_all_treks') }}" class="btn btn-sm btn-outline-light">Cancel</a>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('edit_trek', trek_id=trek.id) }}" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Trek Name</label>
                                <input type="text" name="name" class="form-control" value="{{ trek.name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Location</label>
                                <input type="text" name="location" class="form-control" value="{{ trek.location }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Difficulty</label>
                                <select name="difficulty" class="form-select">
                                    <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                                    <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                                    <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Duration (Days)</label>
                                <input type="number" name="duration_days" class="form-control" value="{{ trek.duration_days }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Available Slots</label>
                                <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Status</label>
                                <select name="status" class="form-select">
                                    <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                                    <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                                    <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                                </select>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label>Assign Staff</label>
                                <select name="assigned_staff_id" class="form-select">
                                    <option value="">Select Staff</option>
                                    {% for staff in approved_staff %}
                                    <option value="{{ staff.id }}" {% if trek.assigned_staff_id == staff.id %}selected{% endif %}>
                                        {{ staff.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Start Date</label>
                                <input type="date" name="start_date" class="form-control" value="{{ trek.start_date }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>End Date</label>
                                <input type="date" name="end_date" class="form-control" value="{{ trek.end_date }}" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Trek</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
